# Publishes https://kajisho5.github.io/ffmpeg-skill/: the landing page in site/ plus the
# repository's own Markdown. .github/scripts/build_pages.py assembles the pages (site/index.html
# -> index, README -> readme, docs/*.md, CHANGELOG) with their relative links checked/rewritten. The repo's
# Settings -> Pages -> Source must be "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "brand/**"
      - "site/**"
      - ".github/scripts/build_pages.py"
      - ".github/scripts/pages_layout.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: python3 .github/scripts/build_pages.py _pages
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: _pages
          destination: _site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
