# Keeps a draft GitHub Release up to date with merged-PR summaries as main moves forward. This is
# purely a human-readable cross-check against CHANGELOG.md -- both the hand-written sections a PR
# may still add itself and the ones release.yml now generates automatically -- and it never
# publishes anything itself. release.yml is the one that actually decides and cuts a release; it
# uses this same repo's release-drafter.yml config (via its own dry-run call) to resolve the next
# version, it doesn't read this draft. See release.yml / README's "Development" -> "Releasing"
# section for the real, fully-automated release flow.
#
# push-to-main only, deliberately: release-drafter reads its config from the DEFAULT branch, so a
# pull_request trigger fails with "Configuration file .github/release-drafter.yml is not found"
# for any PR that hasn't merged yet (a chicken-and-egg problem for the very PR that first adds
# this file, and for any PR opened before this config lands on main). The per-PR "next version"
# preview a pull_request trigger would add isn't essential to what this workflow is actually for.
name: release-drafter

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
