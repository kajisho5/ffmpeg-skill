# Config for release-drafter/release-drafter, used two ways:
#  - release-drafter.yml (the workflow) runs it live on every push to main, keeping a running
#    DRAFT release as a human-readable cross-check -- this draft is never auto-published.
#  - release.yml runs it with dry-run: true to resolve the *actual* next version (via
#    version-resolver below) whenever nobody bumped package.json by hand, then bumps the
#    version and writes CHANGELOG.md itself and releases for real. So the labels below (and
#    "default: patch" for an unlabeled PR) now drive real releases, not just this draft --
#    label a PR "minor"/"feature"/"major" when it needs more than a patch bump.
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "Fixes"
    labels:
      - fix
      - bug
  - title: "Features"
    labels:
      - feature
      - enhancement
  - title: "Other changes"
    labels:
      - chore
      - docs
      - ci
change-template: "- $TITLE (#$NUMBER)"
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - major
  minor:
    labels:
      - minor
      - feature
      - enhancement
  patch:
    labels:
      - patch
      - fix
      - bug
      - chore
      - docs
      - ci
  default: patch
template: |
  ## What's Changed

  $CHANGES

  Cross-check this against CHANGELOG.md's entry for this version (release.yml writes it
  automatically unless a PR already bumped package.json and wrote its own).
