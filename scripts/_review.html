  function touch(id) { if (noteOf(id) && S.picked.indexOf(id) < 0) S.picked.push(id); S.copied = false; }

  var ACT = {
    pick: function (d) { select(d.id); var c = CLIPS.filter(function (o) { return o.c.id === d.id; })[0], q = D.cues.filter(function (x) { return x.id === d.id; })[0], x = S.extra[d.id]; if (c) seek(c.t0); else if (q) seek(q.a); else if (x && x.at !== undefined) seek(x.at); },

      var blob = new Blob([JSON.stringify(P, null, 2) + "\n"], { type: "application/json" }), a = document.createElement("a");
